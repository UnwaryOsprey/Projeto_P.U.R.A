[project]
name = "pura"
version = "1.0.0"
description = "Roteamento adaptativo e seguro em rede mesh IoT (ACO, memético, PSO) com gateway monitorado"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E", "F", "W"]
