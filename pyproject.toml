[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pura"
version = "0.1.0"
description = "P.U.R.A. - Purificação Unificada e Reativa do Ar (versão local, sem Docker)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]   # so para ESP32 reais (modo --mqtt)
dev = ["paho-mqtt>=2.0", "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "matplotlib>=3.8"]

[project.scripts]
pura = "pura.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pura = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701"]
