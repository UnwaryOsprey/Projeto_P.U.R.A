services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883", "8883:8883"]
    volumes:
      - ./infra/mosquitto/${MOSQUITTO_CONF:-mosquitto.dev.conf}:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto:/mosquitto/secure:ro
    restart: unless-stopped

  pura:
    build: .
    env_file: .env
    environment: { TZ: America/Sao_Paulo }  # a janela de sono usa a hora local
    depends_on: [mosquitto]
    ports: ["8000:8000"]
    volumes:
      - ./infra/mosquitto/certs:/certs:ro
    restart: unless-stopped

  # ESP32 virtual: docker compose --profile sim up
  simulator:
    build: .
    profiles: ["sim"]
    command: ["python", "-m", "pura.simulator"]
    env_file: .env
    depends_on: [mosquitto]
    volumes:
      - ./infra/mosquitto/certs:/certs:ro
